<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Lab — Living Subtle Body</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Serif+Devanagari:wght@500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0b0d12; --panel:rgba(18,22,31,.78); --ink:#f0ebe0; --mut:#a8a294;
 --gold:#c9a45c; --gold-hi:#e8cf8f; --teal:#5ec4b6; --rose:#d4899a; --line:#2a3142}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%; background:var(--bg); color:var(--ink);
 font:16px/1.5 Georgia,serif; overflow:hidden}
#scene{position:fixed; inset:0; z-index:1}
#fluid{position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.85}
header{position:fixed; top:0; left:0; right:0; z-index:5; text-align:center;
 padding:.7rem 1rem .3rem; pointer-events:none}
h1{font-family:'Yatra One','Noto Sans Devanagari',serif; font-weight:400;
 font-size:clamp(1.2rem,3.4vw,1.7rem); margin:0;
 background:linear-gradient(100deg,var(--gold-hi),var(--gold) 50%,#9a7a3a);
 -webkit-background-clip:text; background-clip:text; color:transparent}
.hint{color:var(--mut); font-size:.8rem; font-family:ui-sans-serif,system-ui}
#dock{position:fixed; left:0; right:0; bottom:0; z-index:5; display:flex; flex-wrap:wrap;
 gap:.45rem; justify-content:center; padding:.6rem .6rem calc(.6rem + env(safe-area-inset-bottom));
 background:linear-gradient(transparent, rgba(11,13,18,.9))}
#dock button{font-family:ui-sans-serif,system-ui; font-size:.85rem; padding:.6rem .95rem; min-height:42px;
 border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--ink);
 cursor:pointer; backdrop-filter:blur(8px)}
#dock button.on{background:linear-gradient(120deg,var(--gold-hi),var(--gold)); color:#0b0d12; font-weight:700; border-color:var(--gold)}
#dock button:active{transform:scale(.96)}
/* left icon rail — framework picker */
#rail{position:fixed; z-index:6; left:.6rem; top:50%; transform:translateY(-50%);
 display:flex; flex-direction:column; gap:.55rem}
#rail button{width:46px; height:46px; border-radius:50%; border:1px solid var(--line);
 background:var(--panel); color:var(--ink); font-size:19px; cursor:pointer;
 backdrop-filter:blur(8px); transition:border-color .2s, transform .15s}
#rail button:hover{border-color:var(--gold)}
#rail button:active{transform:scale(.93)}
#rail button.on{background:linear-gradient(120deg,var(--gold-hi,#e8cf8f),var(--gold)); color:#0b0d12; border-color:var(--gold)}
#fpanel{position:fixed; z-index:6; left:4.1rem; top:50%; transform:translateY(-50%);
 width:210px; background:var(--panel); border:1px solid var(--line); border-radius:14px;
 padding:.8rem .9rem; backdrop-filter:blur(10px); display:none}
#fpanel.show{display:block}
#fpanel h4{margin:0 0 .2rem; font-size:.95rem; color:var(--gold); font-family:ui-sans-serif,system-ui}
#fpanel p{margin:.2rem 0 .6rem; font-size:.78rem; color:var(--mut)}
#fpanel .row{display:flex; gap:.4rem; flex-wrap:wrap}
#fpanel .row button{font-family:ui-sans-serif,system-ui; font-size:.8rem; padding:.5rem .8rem;
 min-height:40px; border-radius:999px; border:1px solid var(--line); background:transparent;
 color:var(--ink); cursor:pointer}
#fpanel .row button.on{background:var(--gold); color:#0b0d12; border-color:var(--gold); font-weight:700}
#info{position:fixed; z-index:5; right:.7rem; top:4.2rem; width:min(270px,44vw);
 background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:.7rem .9rem;
 backdrop-filter:blur(8px)}
#info .dev{font-family:'Noto Serif Devanagari',serif; font-size:1.7rem; line-height:1.8}
#info .iast{color:var(--gold); font-size:.85rem; font-family:ui-sans-serif,system-ui}
#info .locus{color:var(--mut); font-size:.8rem}
/* phoneme chips — real DOM text: browser shapes every conjunct perfectly, sharp at any zoom */
.glyph{width:38px; height:38px; cursor:pointer; user-select:none;
 transition:opacity .3s}
.glyph svg{display:block; overflow:visible}
.glyph .ring{fill:rgba(20,26,41,.88); stroke:var(--gold); stroke-width:1.5}
.glyph .g{fill:var(--ink); font-size:16px; font-weight:600;
 font-family:'Noto Sans Devanagari','Mangal','Kokila',serif}
.glyph:hover .ring{stroke:var(--gold-hi, #e8cf8f)}
.glyph.lit .ring{fill:var(--gold); stroke:var(--gold-hi, #e8cf8f)}
.glyph.lit .g{fill:#0b0d12; font-weight:700}
.glyph.back{opacity:.18; pointer-events:none}
.glyph:focus-visible{outline:2px solid var(--gold-hi, #e8cf8f); outline-offset:2px; border-radius:50%}
.petal{min-width:30px; height:30px; padding:0 6px; border-radius:999px;
 display:inline-flex; align-items:center; justify-content:center;
 font-family:'Noto Sans Devanagari',serif; font-size:14px; font-weight:600; color:var(--ink);
 background:rgba(20,26,41,.88); border:1.5px solid var(--gold); cursor:pointer; user-select:none;
 transition:background .25s, color .25s}
.petal.core{font-size:17px; border-color:var(--teal)}
.petal.lit{background:var(--gold); color:#0b0d12}
.spoke{font-family:ui-sans-serif,system-ui; font-size:11px; color:var(--ink);
 background:rgba(11,13,18,.8); border:1px solid var(--line); border-radius:999px;
 padding:2px 9px; white-space:nowrap; cursor:pointer; user-select:none}
.spoke.lit{border-color:var(--gold); color:var(--gold-hi, #e8cf8f)}
.seph{text-align:center; cursor:pointer; user-select:none; transition:opacity .3s}
.seph .hb{font-family:'Noto Sans Hebrew','Noto Sans',serif; font-size:19px; font-weight:700;
 display:inline-block; width:40px; height:40px; line-height:38px; border-radius:50%;
 border:2px solid; background:rgba(11,13,18,.8)}
.seph .nm{display:block; font-size:10px; letter-spacing:.05em; color:var(--ink);
 font-family:ui-sans-serif,system-ui; margin-top:2px; text-shadow:0 1px 6px #000}
.seph .gd{display:block; font-size:9px; color:var(--mut); font-family:ui-sans-serif,system-ui}
.seph.lit .hb{background:var(--gold); color:#0b0d12 !important; border-color:var(--gold-hi, #e8cf8f) !important}
.klabel{font-size:10px; letter-spacing:.06em; color:var(--teal);
 font-family:ui-sans-serif,system-ui; white-space:nowrap; opacity:.85}
#legend{position:fixed; z-index:5; left:.7rem; top:4.2rem; font-size:.72rem; color:var(--mut);
 font-family:ui-sans-serif,system-ui; background:rgba(18,22,31,.6); padding:.5rem .7rem; border-radius:10px}
@media (max-width:640px){ #legend{display:none} #info{top:auto; bottom:4.4rem; right:.5rem} }
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
</head>
<body>
<canvas id="fluid"></canvas>
<canvas id="scene"></canvas>
<nav id="rail" aria-label="Frameworks">
 <button id="rTrika" class="on" title="Trika · Mātṛkā/Mālinī">☸</button>
 <button id="rPillar" title="Middle Pillar" style="display:none">☩</button>
 <button id="rLotus" title="Anahata lotus" style="display:none">🪷</button>
 <button id="rKal" title="Kālacakra centres" style="display:none">❖</button>
 <button id="rScan" title="Body scan">◉</button>
 <button id="rYan" title="Yantra overlay">△</button>
 <button id="rFluid" title="Fluid prāṇa-field">🌊</button>
 <button id="rX" title="X-ray shell">◈</button>
</nav>
<div id="fpanel" aria-live="polite"><h4></h4><p></p><div class="row"></div></div>
<header><h1>जीव — living subtle body</h1><div class="hint">drag to orbit · scroll to zoom · tap any glyph</div></header>
<div id="legend">wireframe = inscribed grid (Flood: constructed, not found)<br/>gold channel = suṣumṇā · helix = iḍā/piṅgalā<br/>rings = cakra overlay (PEDAGOGICAL, late model)</div>
<div id="info" aria-live="polite"><div class="dev">अ</div><div class="iast">a · forehead</div><div class="locus">Tap a glyph — hear it, watch prāṇa answer.</div></div>
<div id="dock">
 <button id="bOm">▶ OM</button><button id="bNam">▶ Namaḥ Śivāya</button>
 <button id="bHa">⚡ ha flash</button>
 <button data-s="sutra">caitanyam</button><button data-s="hrdaye">hṛdaye</button>
</div>
<script type="module" src="lab.js"></script>
</body>
</html>
