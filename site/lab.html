<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Body — mantra dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Serif+Devanagari:wght@500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#ffffff; --panel:rgba(255,255,255,.9); --ink:#22242c; --mut:#6d7180;
 --gold:#a86f14; --gold-hi:#8a5a0c; --teal:#1f7a6e; --rose:#b04a5a; --line:#d9d3c1}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%; background:var(--bg); color:var(--ink);
 font:16px/1.5 Georgia,serif; overflow:hidden}
#scene{position:fixed; inset:0; z-index:1}
#fluid{position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.55;
 -webkit-mask-image:radial-gradient(ellipse 62% 68% at 50% 44%, #000 42%, transparent 78%);
 mask-image:radial-gradient(ellipse 62% 68% at 50% 44%, #000 42%, transparent 78%)}
#vitruv{position:fixed; inset:0; margin:auto; height:94vh; z-index:0; opacity:.16;
 filter:sepia(.55) saturate(.85); pointer-events:none; display:none}
body.split #scene{right:50%}
body.split #fluid{right:50%}
#second{display:none}
body.split #second{display:block; position:fixed; z-index:1; top:0; right:0; width:50%; height:100%; border:0; border-left:1px solid var(--line)}
/* single circle menu */
#menuBtn{position:fixed; z-index:10; left:.8rem; bottom:.8rem; width:52px; height:52px;
 border-radius:12px; border:1px solid var(--line); cursor:pointer; background:var(--panel);
 backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; padding:0}
#menuBtn.on{border-color:var(--gold); box-shadow:0 0 0 2px var(--gold)}
#menuBtn svg{display:block}
#splitBtn{position:fixed; z-index:10; right:.8rem; bottom:.8rem; width:52px; height:52px;
 border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--ink);
 font-size:26px; line-height:1; cursor:pointer; backdrop-filter:blur(8px)}
#splitBtn.on{border-color:var(--gold); color:var(--gold)}
#menu{position:fixed; z-index:10; top:0; left:0; bottom:0; width:320px;
 background:var(--panel); border-right:1px solid var(--line);
 padding:4.3rem .8rem .9rem; backdrop-filter:blur(12px); display:none;
 overflow-y:auto}
#menu.show{display:block}
@media (min-width:900px){ #menu.show{display:block} }
#menu h3{margin:.8rem 0 .4rem; font-size:.72rem; letter-spacing:.1em; text-transform:uppercase;
 color:var(--mut); font-family:ui-sans-serif,system-ui}
#menu h3:first-child{margin-top:0}
#menu details.trad{border:1px solid var(--line); margin:.4rem 0; padding:.1rem .55rem .45rem; background:rgba(255,255,255,.5)}
#menu details.trad > summary{cursor:pointer; font-size:.9rem; font-weight:700;
 color:var(--ink); font-family:ui-sans-serif,system-ui; list-style:none; padding:.45rem 0}
#menu details.trad > summary::-webkit-details-marker{display:none}
#menu details.trad > summary::before{content:'▸ '; color:var(--mut)}
#menu details.trad[open] > summary::before{content:'▾ '; color:var(--gold)}
#menu details.course{border:1px solid var(--line); margin:.35rem 0; background:#fff}
#menu details.course > summary{cursor:pointer; font-size:.85rem; font-weight:600; padding:.45rem .55rem;
 color:var(--ink); font-family:ui-sans-serif,system-ui; list-style:none}
#menu details.course > summary::-webkit-details-marker{display:none}
#menu .phase{border-top:1px solid var(--line); padding:.5rem .55rem; display:grid; gap:.35rem}
#menu .phase .pt{font-size:.85rem; font-weight:700; font-family:ui-sans-serif,system-ui}
#menu .phase .pd{font-size:.78rem; color:var(--mut); font-family:ui-sans-serif,system-ui}
#menu .phase .prow{display:grid; grid-template-columns:1fr 1fr; gap:.35rem}
#menu .phase button{font-family:ui-sans-serif,system-ui; font-size:.85rem; padding:.55rem .5rem;
 min-height:42px; border-radius:6px; border:1px solid var(--line); background:#fff;
 color:var(--ink); cursor:pointer}
#menu .phase button.play{background:linear-gradient(120deg,var(--gold-hi),var(--gold)); color:#0b0d12; border-color:var(--gold); font-weight:700}
#menu .phase button.on{border-color:var(--gold); color:var(--gold-hi); font-weight:700}
#menu .grid2{display:grid; grid-template-columns:1fr 1fr; gap:.35rem}
#menu .grid2 button{font-family:ui-sans-serif,system-ui; font-size:.85rem; padding:.55rem .5rem;
 min-height:42px; border-radius:6px; border:1px solid var(--line); background:#fff;
 color:var(--ink); cursor:pointer}
#menu .grid2 button.on{background:linear-gradient(120deg,var(--gold-hi),var(--gold)); color:#0b0d12; border-color:var(--gold); font-weight:700}
#menu .row{display:grid; grid-template-columns:1fr 1fr; gap:.35rem}
#menu .row button{font-family:ui-sans-serif,system-ui; font-size:.85rem; padding:.55rem .5rem;
 min-height:42px; border-radius:6px; border:1px solid var(--line); background:#fff;
 color:var(--ink); cursor:pointer}
#menu .row button.on{background:linear-gradient(120deg,var(--gold-hi),var(--gold)); color:#0b0d12; border-color:var(--gold); font-weight:700}
#menu .note{font-size:.75rem; color:var(--mut); margin:.3rem 0 0}
#menu a{color:var(--gold)}
#askRow{display:flex; gap:.35rem; margin-top:.3rem}
#askQ{flex:1; min-width:0; background:rgba(255,255,255,.8); border:1px solid var(--line);
 border-radius:8px; color:var(--ink); font-size:.8rem; padding:.5rem .6rem; font-family:ui-sans-serif,system-ui}
/* single-line readout */
#readout{position:fixed; z-index:5; left:50%; bottom:.9rem; transform:translateX(-50%);
 font-family:'Noto Serif Devanagari',serif; font-size:1.05rem; color:var(--ink);
 background:rgba(11,13,18,.65); border:1px solid var(--line); border-radius:999px;
 padding:.35rem 1.1rem; backdrop-filter:blur(8px); white-space:nowrap; max-width:92vw;
 overflow:hidden; text-overflow:ellipsis; pointer-events:none}
body.split #readout{left:25%}
#readout b{color:var(--gold); font-weight:600}
#info{display:none}
/* phoneme chips — real DOM text: browser shapes every conjunct perfectly, sharp at any zoom */
.glyph{font-family:'Noto Sans Devanagari','Mangal','Kokila',serif; font-size:21px;
 font-weight:500; color:rgba(34,36,44,.88); cursor:pointer; user-select:none;
 padding:6px; transition:color .2s, opacity .3s}
.glyph:hover{color:#000}
.glyph.lit{color:var(--gold-hi, #8a5a0c); font-weight:700;
 text-shadow:0 0 10px rgba(168,111,20,.45); animation:chipPop .45s ease-out}
@keyframes chipPop{0%{scale:.6}60%{scale:1.25}100%{scale:1}}
.glyph.back{opacity:.16; pointer-events:none}
.glyph:focus-visible{outline:2px solid var(--gold-hi, #e8cf8f); outline-offset:2px; border-radius:6px}
.petal{min-width:30px; height:30px; padding:0 6px; border-radius:999px;
 display:inline-flex; align-items:center; justify-content:center;
 font-family:'Noto Sans Devanagari',serif; font-size:14px; font-weight:600; color:var(--ink);
 background:rgba(255,255,255,.9); border:1.5px solid var(--gold); cursor:pointer; user-select:none;
 transition:background .25s, color .25s}
.petal.core{font-size:17px; border-color:var(--teal)}
.petal.lit{background:var(--gold); color:#0b0d12}
.spoke{font-family:ui-sans-serif,system-ui; font-size:11px; color:var(--ink);
 background:rgba(255,255,255,.85); border:1px solid var(--line); border-radius:999px;
 padding:2px 9px; white-space:nowrap; cursor:pointer; user-select:none}
.spoke.lit{border-color:var(--gold); color:var(--gold-hi, #e8cf8f)}
#chladniBox{position:fixed; z-index:5; left:.7rem; bottom:.7rem; width:220px;
 background:rgba(11,13,18,.85); border:1px solid var(--line); border-radius:12px;
 padding:.45rem; backdrop-filter:blur(8px)}
#chladni{width:100%; height:auto; display:block; border-radius:8px}
#chladniCap{font-size:.68rem; color:var(--mut); font-family:ui-sans-serif,system-ui;
 text-align:center; padding-top:.25rem}
.seph{text-align:center; cursor:pointer; user-select:none; transition:opacity .3s}
.seph .hb{font-family:'Noto Sans Hebrew','Noto Sans',serif; font-size:19px; font-weight:700;
 display:inline-block; width:40px; height:40px; line-height:38px; border-radius:50%;
 border:2px solid; background:rgba(255,255,255,.88)}
.seph .nm{display:block; font-size:10px; letter-spacing:.05em; color:var(--ink);
 font-family:ui-sans-serif,system-ui; margin-top:2px; text-shadow:0 1px 6px #000}
.seph .gd{display:block; font-size:9px; color:var(--mut); font-family:ui-sans-serif,system-ui}
.seph.lit .hb{background:var(--gold); color:#0b0d12 !important; border-color:var(--gold-hi, #e8cf8f) !important}
.klabel{font-size:10px; letter-spacing:.06em; color:var(--teal);
 font-family:ui-sans-serif,system-ui; white-space:nowrap; opacity:.85}
/* chant dock — right side, never leaves the body */
#side{position:fixed; z-index:9; top:0; right:0; bottom:0; width:300px; max-width:86vw;
 background:var(--panel); border-left:1px solid var(--line); backdrop-filter:blur(12px);
 padding:.9rem; overflow-y:auto; transform:translateX(105%); transition:transform .25s ease}
#side.open{transform:none}
#side h2{font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--mut);
 font-family:ui-sans-serif,system-ui; margin:0 0 .5rem}
#side .card{background:#fff; border:1px solid var(--line); border-radius:12px;
 padding:1.2rem .8rem; text-align:center}
#side .sglyph{font-family:'Noto Serif Devanagari',serif; font-size:3.2rem; line-height:1.4}
#side .siast{color:var(--gold-hi); font-family:ui-sans-serif,system-ui; font-size:.95rem}
#side .slocus{color:var(--mut); font-size:.85rem; margin:.2rem 0}
#side .sflag{color:#b04a5a; font-size:.78rem; min-height:1.3em}
#side .scount{color:var(--mut); font-size:.75rem; font-family:ui-sans-serif,system-ui}
#side .tport{display:grid; grid-template-columns:1fr 1fr 1fr; gap:.35rem; margin:.6rem 0}
#side .tport button{font-family:ui-sans-serif,system-ui; font-size:.9rem; padding:.55rem 0;
 min-height:42px; border-radius:6px; border:1px solid var(--line); background:#fff;
 color:var(--ink); cursor:pointer}
#side .tport button.big{grid-column:1/-1; background:linear-gradient(120deg,var(--gold-hi),var(--gold));
 color:#0b0d12; border-color:var(--gold); font-weight:700}
#side .srow{display:flex; gap:.4rem; align-items:center; margin:.4rem 0;
 font-size:.8rem; color:var(--mut); font-family:ui-sans-serif,system-ui}
#side select,#side input[type=range]{flex:1; min-width:0}
#side .qopts{display:grid; grid-template-columns:1fr 1fr; gap:.35rem; margin:.5rem 0}
#side .qopts button{font-family:'Noto Serif Devanagari',serif; font-size:1.8rem; min-height:60px;
 border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer}
/* embed mode: bare body only */
body.embed #menuBtn,body.embed #splitBtn,body.embed #menu,body.embed #readout{display:none}
@media (max-width:640px){
 body.split #scene{right:0; bottom:50%}
 body.split #fluid{right:0; bottom:50%}
 body.split #second{width:100%; height:50%; top:50%; border-left:0; border-top:1px solid var(--line)}
 body.split #readout{left:50%; bottom:auto; top:.8rem}
 #chladniBox{width:150px}
}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
</head>
<body>
<canvas id="fluid"></canvas>
<img id="vitruv" alt=""/>
<canvas id="scene"></canvas>
<div id="booterr" style="display:none;position:fixed;z-index:99;left:.6rem;right:.6rem;top:.6rem;background:#3a1420;color:#ffd7de;font:13px/1.4 ui-sans-serif,system-ui;padding:.7rem .9rem;border-radius:10px;border:1px solid #d4899a"></div>
<script>
window.__bootErrors=[];
window.addEventListener('error',function(e){
  var m='Error: '+(e.message||e.type)+' @'+((e.filename||'').split('/').pop()||'?')+':'+(e.lineno||'?');
  window.__bootErrors.push(m);
  var b=document.getElementById('booterr');
  if(b){b.style.display='block';b.textContent=m+(window.__bootErrors.length>1?' (+'+(window.__bootErrors.length-1)+' more)':'');}
},true);
window.addEventListener('unhandledrejection',function(e){
  var m='Promise: '+((e.reason&&(e.reason.message||e.reason))||'?');
  window.__bootErrors.push(m);
  var b=document.getElementById('booterr');
  if(b){b.style.display='block';b.textContent=m;}
});
</script>
<button id="menuBtn" aria-label="Menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#22242c" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2.5 21 7.5v9l-9 5-9-5v-9z"/><path d="M12 12 21 7.5M12 12 3 7.5M12 12v9.5"/></svg></button>
<button id="splitBtn" aria-label="Compare side by side">+</button>
<aside id="side" aria-label="Chant audio"></aside>
<nav id="menu" aria-label="Menu"></nav>
<div id="readout" aria-live="polite" style="display:none"></div>
<div id="info" aria-hidden="true"><div class="dev">अ</div><div class="iast">a · forehead</div><div class="locus"></div>
<form id="ask"><input id="askQ" type="text" autocomplete="off"/><button type="submit">?</button></form></div>
<div id="chladniBox" style="display:none"><canvas id="chladni" width="220" height="220"></canvas><div id="chladniCap">—</div></div>
<iframe id="second" title="Second body"></iframe>
<script type="module" src="lab.js"></script>
</body>
</html>
